name: Package desktop app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libnss3
      - run: python -m pip install -e ".[package,desktop]"
      - if: runner.os == 'Linux'
        run: python -m pip install "pywebview[pyside6]>=6,<7"
      - run: python tools/privacy_check.py
      - run: python tools/build_package.py
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Smoke-test packaged desktop app
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          JLU_BOOKING_LOCAL_DIR: ${{ github.workspace }}\smoke-data
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $PWD 'dist\JLU Booking\JLU Booking.exe'
          $stdout = Join-Path $PWD 'smoke-stdout.log'
          $stderr = Join-Path $PWD 'smoke-stderr.log'
          $process = Start-Process -FilePath $exe `
            -ArgumentList '--no-window', '--port', '18765' `
            -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $ready = $false
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Milliseconds 500
              if ($process.HasExited) { break }
              try {
                $response = Invoke-WebRequest -Uri 'http://127.0.0.1:18765/' `
                  -UseBasicParsing -TimeoutSec 2 -MaximumRedirection 5
                if ($response.StatusCode -eq 200) { $ready = $true; break }
              } catch {
                # Keep polling until the server binds the port.
              }
            }
            if (-not $ready) {
              Write-Host '--- stdout ---'
              if (Test-Path $stdout) { Get-Content $stdout }
              Write-Host '--- stderr ---'
              if (Test-Path $stderr) { Get-Content $stderr }
              $log = Join-Path $env:JLU_BOOKING_LOCAL_DIR 'local.log'
              if (Test-Path $log) {
                Write-Host '--- local.log ---'
                Get-Content $log
              }
              throw 'Packaged desktop app did not become ready.'
            }
            $log = Join-Path $env:JLU_BOOKING_LOCAL_DIR 'local.log'
            if (-not (Test-Path $log)) {
              throw 'Packaged desktop app did not write local.log.'
            }
            Write-Host 'Packaged desktop app started and answered HTTP 200.'
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
      - name: Smoke-test packaged booking worker
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $worker = Join-Path $PWD 'dist\JLU Booking\JLU Booking Worker.exe'
          $workerOut = Join-Path $PWD 'worker-help.log'
          $workerErr = Join-Path $PWD 'worker-help.err.log'
          $process = Start-Process -FilePath $worker -ArgumentList '--help' `
            -PassThru -Wait -RedirectStandardOutput $workerOut -RedirectStandardError $workerErr
          if ($process.ExitCode -ne 0) {
            if (Test-Path $workerErr) { Get-Content $workerErr }
            throw "Booking worker --help exited with $($process.ExitCode)."
          }
          if (-not (Test-Path $workerOut) -or (Get-Item $workerOut).Length -eq 0) {
            throw 'Booking worker did not write its help text to stdout.'
          }
          Write-Host 'Packaged booking worker produced console output.'
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = @(
            (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'),
            (Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe')
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw 'Inno Setup 6 (ISCC.exe) was not found.' }
          $version = (python -c "import jlu_booking; print(jlu_booking.__version__)").Trim()
          & $iscc "/DMyAppVersion=$version" 'packaging\windows-installer.iss'
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE." }
          if (-not (Test-Path 'dist\JLU-Booking-Setup.exe')) {
            throw 'Installer was not created.'
          }
      - name: Verify Windows installer creates a desktop shortcut
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $PWD 'dist\JLU-Booking-Setup.exe'
          $installDir = Join-Path $env:LOCALAPPDATA 'Programs\JLU Booking'
          $desktop = [Environment]::GetFolderPath('Desktop')
          $shortcutPath = Join-Path $desktop 'JLU Booking.lnk'
          if (Test-Path $installDir) { Remove-Item -Recurse -Force $installDir }
          if (Test-Path $shortcutPath) { Remove-Item -Force $shortcutPath }

          $install = Start-Process -FilePath $installer `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-' `
            -PassThru -Wait
          if ($install.ExitCode -ne 0) {
            throw "Installer exited with $($install.ExitCode)."
          }
          foreach ($name in 'JLU Booking.exe', 'JLU Booking Worker.exe') {
            if (-not (Test-Path (Join-Path $installDir $name))) {
              throw "Installed file is missing: $name"
            }
          }
          if (-not (Test-Path $shortcutPath)) {
            throw 'Installer did not create a desktop shortcut.'
          }
          $shortcut = (New-Object -ComObject WScript.Shell).CreateShortcut($shortcutPath)
          $expectedTarget = Join-Path $installDir 'JLU Booking.exe'
          if ($shortcut.TargetPath -ne $expectedTarget) {
            throw "Desktop shortcut target is wrong: $($shortcut.TargetPath)"
          }
          Write-Host 'Installer created the desktop shortcut with the expected target.'

          $uninstaller = Join-Path $installDir 'unins000.exe'
          if (Test-Path $uninstaller) {
            $uninstall = Start-Process -FilePath $uninstaller `
              -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' `
              -PassThru -Wait
            if ($uninstall.ExitCode -ne 0) {
              throw "Uninstaller exited with $($uninstall.ExitCode)."
            }
          }
      - if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path 'dist/JLU Booking' -DestinationPath 'jlu-booking-Windows.zip'
      - if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent 'dist/JLU Booking.app' 'jlu-booking-macOS.zip'
      - if: runner.os == 'Linux'
        run: tar -C dist -czf jlu-booking-Linux.tar.gz 'JLU Booking'
      - uses: actions/upload-artifact@v4
        with:
          name: jlu-booking-${{ runner.os }}
          path: jlu-booking-*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: jlu-booking-Windows-installer
          path: dist/JLU-Booking-Setup.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: jlu-booking-*
          path: release-files
          merge-multiple: true
      - name: Publish GitHub Release
        run: gh release create "$GITHUB_REF_NAME" release-files/* --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
