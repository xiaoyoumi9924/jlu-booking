{% extends "admin/shell.html" %}
{% block title %}管理员重新验证 · JLU 体育馆预约{% endblock %}
{% block admin_heading %}重新验证{% endblock %}
{% block content %}<div class="admin-content-intro"><div><p class="eyebrow">敏感操作</p><h2>重新验证管理员密码</h2><p>验证后五分钟内可临时查看完整 Token；离开页面后显示内容会清除。</p></div><a class="button secondary" href="/admin/users">返回用户管理</a></div><section class="admin-detail-card admin-reauth-card">{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}<form method="post" action="/admin/reauth"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>管理员密码<input type="password" name="password" autocomplete="current-password" required></label><button type="submit">验证身份</button></form></section>{% endblock %}
