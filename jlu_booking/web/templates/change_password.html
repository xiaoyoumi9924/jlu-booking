{% extends "base.html" %}
{% block title %}修改密码 · JLU 体育馆预约{% endblock %}
{% block page_class %}auth-page{% endblock %}
{% block content %}
<section class="card auth-card">
  <h1>修改密码</h1>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/change-password">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>当前密码<input type="password" name="current_password" autocomplete="current-password" required></label>
    <label>新密码<input type="password" name="new_password" minlength="10" autocomplete="new-password" required></label>
    <button type="submit">保存新密码</button>
  </form>
</section>
{% endblock %}
