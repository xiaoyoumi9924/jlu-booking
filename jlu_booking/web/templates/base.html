<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}JLU 体育馆预约{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}">
  <script defer src="{{ url_for('static', path='/app.js') }}"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">
      <img src="{{ url_for('static', path='/JLU_LOGO.png') }}" alt="吉林大学">
      <span>体育馆预约助手</span>
    </a>
  </header>
  {% block navigation %}{% endblock %}
  <main class="page {% block page_class %}{% endblock %}">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
