[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jlu-booking"
version = "2.4.1"
description = "Cross-platform desktop and automatic booking helper for JLU sports venues"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["jlu", "booking", "sports", "tkinter"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Utilities",
]
dependencies = [
  "platformdirs>=4.0,<5",
  "requests>=2.31,<3",
  "tzdata>=2024.1; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
package = ["pyinstaller>=6,<7"]
web = [
  "argon2-cffi>=23.1,<26",
  "cryptography>=43,<47",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.12,<1",
  "uvicorn>=0.30,<1",
]

[project.scripts]
jlu-booking-auto = "jlu_booking.auto:main"
jlu-booking-token = "jlu_booking.token_cli:main"
jlu-booking-status = "jlu_booking.status_cli:main"
jlu-booking-web = "jlu_booking.web.cli:main"

[project.gui-scripts]
jlu-booking = "jlu_booking.__main__:main"

[tool.setuptools.packages.find]
include = ["jlu_booking*"]

[tool.setuptools.package-data]
jlu_booking = [
  "web/templates/*.html",
  "web/static/*.css",
  "web/static/*.js",
  "web/static/*.png",
]

[tool.setuptools.data-files]
"share/jlu-booking/assets" = ["assets/JLU_LOGO.png"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
